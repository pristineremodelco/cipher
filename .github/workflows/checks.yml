# Tests and builds a pull request. A push to main already does this inside
# the Pages and Cloudflare workflows, and those also publish, so this one
# stays off main and does not deploy.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build
        env:
          BASE_PATH: /cipher/
